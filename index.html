<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Docks (Pvt.) Ltd</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.svg" />
    <meta name="description" content="One Window Logistics Solution - Afghan Transit, Customs Clearance, Freight & Client Portal" />
    <meta property="og:title" content="Docks (Pvt.) Ltd" />
    <meta property="og:description" content="One Window Logistics Solution - Afghan Transit, Customs Clearance, Freight & Client Portal" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                950: '#020617', // Sidebar bg
                900: '#0a0f1c', // Main bg
                800: '#111827', // Card bg
                700: '#1f2937', // Border/Hover
                600: '#2563eb', // Primary
                500: '#3b82f6', // Lighter Blue
                accent: '#06b6d4', // Cyan
                success: '#10b981',
                warning: '#f59e0b',
                danger: '#ef4444',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'float': 'float 6s ease-in-out infinite',
              'pulse-glow': 'pulseGlow 3s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              pulseGlow: {
                '0%, 100%': { opacity: '1', filter: 'brightness(1)' },
                '50%': { opacity: '0.8', filter: 'brightness(1.2)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar for Glass Theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2); 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1); 
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2); 
      }

      /* Deep Animated Gradient Background */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        height: 100%;
        width: 100%;
        min-height: 100%;
        min-height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
      }
      body {
        background-color: #0f172a;
        background-image: 
          radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%), 
          radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%), 
          radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.1) 0px, transparent 50%), 
          radial-gradient(at 0% 100%, rgba(15, 23, 42, 1) 0px, transparent 50%);
        background-attachment: fixed;
        background-size: cover;
        color: #f3f4f6;
      }

      /* Glass Utility Classes */
      .glass-card {
        background: rgba(17, 24, 39, 0.4); /* brand-950 with opacity */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .glass-input {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        transition: all 0.2s;
      }
      .glass-input:focus {
        background: rgba(0, 0, 0, 0.5);
        border-color: #3b82f6; /* brand-500 */
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }
      
      /* Progress Bar Animation */
      @keyframes progress {
        0% { width: 0%; }
        100% { width: 100%; }
      }
      .animate-progress {
        animation: progress 3s ease-out forwards;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
