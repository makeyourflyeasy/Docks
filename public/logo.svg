<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="dplGoldGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="12%" stop-color="#FCE182" />
      <stop offset="28%" stop-color="#EDB840" />
      <stop offset="48%" stop-color="#CCA026" />
      <stop offset="68%" stop-color="#F8DD7B" />
      <stop offset="85%" stop-color="#E2B438" />
      <stop offset="100%" stop-color="#B28014" />
    </linearGradient>

    <!-- Speed Stripes Gradient -->
    <linearGradient id="dplStripeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DBAC33" />
      <stop offset="50%" stop-color="#FCE48D" />
      <stop offset="100%" stop-color="#C2921C" />
    </linearGradient>

    <!-- Soft Depth & Bevel Drop Shadow -->
    <filter id="dplDropShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6B4803" flood-opacity="0.38" />
    </filter>
  </defs>

  <g filter="url(#dplDropShadow)">
    <!-- LEFT 3 SPEED STRIPES -->
    <!-- Top Stripe (Longest) -->
    <path 
      d="M 45,36 L 215,36 L 203,62 L 45,62 Z" 
      fill="url(#dplStripeGrad)" 
      stroke="#8C630D" 
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <!-- Middle Stripe (Medium) -->
    <path 
      d="M 45,80 L 180,80 L 168,106 L 45,106 Z" 
      fill="url(#dplStripeGrad)" 
      stroke="#8C630D" 
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <!-- Bottom Stripe (Shortest) -->
    <path 
      d="M 45,124 L 145,124 L 133,150 L 45,150 Z" 
      fill="url(#dplStripeGrad)" 
      stroke="#8C630D" 
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- LETTER 'D' WITH ICONIC STEPPED ZIG-ZAG CUTOUT -->
    <path
      fill-rule="evenodd"
      d="
        M 265,36
        L 370,36
        C 415,36 442,65 442,105
        C 442,155 410,204 345,204
        L 145,204
        L 225,120
        L 280,120
        L 298,80
        L 245,80
        Z
        M 305,68
        L 345,68
        C 370,68 388,86 388,110
        C 388,142 368,172 335,172
        L 278,172
        L 302,144
        L 322,144
        L 332,102
        L 288,102
        Z
      "
      fill="url(#dplGoldGrad)"
      stroke="#8C630D"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- LETTER 'P' WITH SLANTED STEM & ROUNDED BOWL -->
    <path
      fill-rule="evenodd"
      d="
        M 485,36
        L 580,36
        C 630,36 655,62 655,98
        C 655,134 628,152 575,152
        L 508,152
        L 482,204
        L 415,204
        Z
        M 522,68
        L 560,68
        C 585,68 600,80 600,98
        C 600,116 585,122 560,122
        L 498,122
        Z
      "
      fill="url(#dplGoldGrad)"
      stroke="#8C630D"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- LETTER 'L' - UPPER SLANTED PARALLELOGRAM -->
    <path
      d="
        M 685,36
        L 770,36
        L 715,132
        L 630,132
        Z
      "
      fill="url(#dplGoldGrad)"
      stroke="#8C630D"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- LETTER 'L' - LOWER AERODYNAMIC BASE FOOT -->
    <path
      d="
        M 625,148
        C 605,148 595,160 595,176
        C 595,192 605,204 625,204
        L 770,204
        L 795,148
        Z
      "
      fill="url(#dplGoldGrad)"
      stroke="#8C630D"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- RIGHT 3 SPEED STRIPES -->
    <!-- Top Stripe -->
    <path 
      d="M 820,148 L 955,148 L 955,164 L 813,164 Z" 
      fill="url(#dplStripeGrad)" 
      stroke="#8C630D" 
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <!-- Middle Stripe -->
    <path 
      d="M 808,168 L 955,168 L 955,184 L 801,184 Z" 
      fill="url(#dplStripeGrad)" 
      stroke="#8C630D" 
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <!-- Bottom Stripe -->
    <path 
      d="M 796,188 L 955,188 L 955,204 L 789,204 Z" 
      fill="url(#dplStripeGrad)" 
      stroke="#8C630D" 
      stroke-width="1.2"
      stroke-linejoin="round"
    />
  </g>
</svg>
